<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">Cara kerja content-helper</title>
  <desc id="d">Empat langkah: tentukan jenis konten, verifikasi ke sumber resmi, tulis per platform dalam dua jalur dan dua gaya, lalu beri rekomendasi platform.</desc>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; }
    .card { fill: #0b1f1e; stroke: #134e4a; stroke-width: 2; animation: cardAct 8s ease-in-out infinite; animation-delay: var(--d); }
    .num  { fill: #134e4a; animation: numAct 8s ease-in-out infinite; animation-delay: var(--d); }
    .step { animation: lift 8s ease-in-out infinite; animation-delay: var(--d); }
    .dot  { animation: travel 8s linear infinite; }
    .glow { animation: travel 8s linear infinite; }
    .ttl  { fill: #e6fffb; font-size: 22px; font-weight: 700; }
    .sub  { fill: #9fcdc6; font-size: 15px; }
    .n    { fill: #ffffff; font-size: 18px; font-weight: 700; }
    @keyframes cardAct { 0% { stroke: #134e4a; fill: #0b1f1e; } 4%,22% { stroke: #2dd4bf; fill: #0f2f2c; } 28%,100% { stroke: #134e4a; fill: #0b1f1e; } }
    @keyframes numAct  { 0% { fill: #134e4a; } 4%,22% { fill: #14b8a6; } 28%,100% { fill: #134e4a; } }
    @keyframes lift    { 0% { transform: none; } 4%,22% { transform: translateY(-6px); } 28%,100% { transform: none; } }
    @keyframes travel  { 0% { transform: translateX(0); opacity: 1; } 75% { transform: translateX(870px); opacity: 1; } 80%,100% { transform: translateX(870px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <rect width="1200" height="340" rx="28" fill="#071a19"/>
  <text x="60" y="58" font-size="28" font-weight="700" fill="#ffffff">Cara kerja content-helper</text>
  <text x="1140" y="56" font-size="16" fill="#5f9a93" text-anchor="end">Satu bahan masuk, banyak platform keluar</text>

  <!-- jalur -->
  <line x1="165" y1="190" x2="1035" y2="190" stroke="#134e4a" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <g class="glow"><circle cx="165" cy="190" r="16" fill="#2dd4bf" opacity="0.25"/></g>
  <g class="dot"><circle cx="165" cy="190" r="7" fill="#5eead4"/></g>

  <!-- langkah 1 -->
  <g class="step" style="--d:0s">
    <rect class="card" x="40" y="105" width="250" height="170" rx="20"/>
    <circle class="num" cx="78" cy="143" r="18"/><text class="n" x="78" y="149.5" text-anchor="middle">1</text>
    <text class="ttl" x="64" y="212">Pilah jenis</text>
    <text class="sub" x="64" y="238">Tips, pelajaran, opini,</text>
    <text class="sub" x="64" y="258">atau cerita proses.</text>
  </g>
  <!-- langkah 2 -->
  <g class="step" style="--d:2s">
    <rect class="card" x="330" y="105" width="250" height="170" rx="20"/>
    <circle class="num" cx="368" cy="143" r="18"/><text class="n" x="368" y="149.5" text-anchor="middle">2</text>
    <text class="ttl" x="354" y="212">Verifikasi</text>
    <text class="sub" x="354" y="238">Angka, versi, dan batas</text>
    <text class="sub" x="354" y="258">platform dicek ke sumber.</text>
  </g>
  <!-- langkah 3 -->
  <g class="step" style="--d:4s">
    <rect class="card" x="620" y="105" width="250" height="170" rx="20"/>
    <circle class="num" cx="658" cy="143" r="18"/><text class="n" x="658" y="149.5" text-anchor="middle">3</text>
    <text class="ttl" x="644" y="212">Per platform</text>
    <text class="sub" x="644" y="238">LinkedIn, Threads, IG, dll,</text>
    <text class="sub" x="644" y="258">tiap Valid dan Standard.</text>
  </g>
  <!-- langkah 4 -->
  <g class="step" style="--d:6s">
    <rect class="card" x="910" y="105" width="250" height="170" rx="20"/>
    <circle class="num" cx="948" cy="143" r="18"/><text class="n" x="948" y="149.5" text-anchor="middle">4</text>
    <text class="ttl" x="934" y="212">Rekomendasi</text>
    <text class="sub" x="934" y="238">Platform mana yang cocok,</text>
    <text class="sub" x="934" y="258">dan apa yang dicek dulu.</text>
  </g>

  <text x="600" y="318" font-size="14" fill="#5f9a93" text-anchor="middle">LinkedIn · Threads · Facebook · Instagram · TikTok · Quora · blog</text>
</svg>
