name: Usulan fitur
description: Usul kemampuan baru atau penyesuaian untuk platform tertentu.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Masalah yang ingin diselesaikan
      description: Ceritakan situasi nyata, bukan hanya solusinya.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Usulan
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatif yang sudah dipertimbangkan
  - type: checkboxes
    id: principles
    attributes:
      label: Prinsip
      options:
        - label: Usulan ini tidak membolehkan klaim dari ingatan masuk ke jalur Valid
          required: true
