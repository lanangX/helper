name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI (untuk claude plugin validate)
        run: npm install -g @anthropic-ai/claude-code

      - name: Pastikan tidak ada placeholder OWNER tersisa
        run: |
          if grep -rn 'OWNER/hel[p]er' . \
              --include='*.md' --include='*.json' --include='*.yml' \
              --exclude-dir=.git --exclude-dir=dist ; then
            echo "::error::Ganti placeholder OWNER dengan username GitHub sebelum commit"
            exit 1
          fi

      - name: Validasi dan build
        run: ./scripts/build.sh

      - name: Simpan zip hasil build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*.zip
          if-no-files-found: error
